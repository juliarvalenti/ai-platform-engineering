[project]
name = "tome-agent"
version = "0.1.0"
license = "Apache-2.0"
description = "Tome agent — a Claude Agent SDK ingest/chat service for the caipe Tome wiki app."
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "claude-agent-sdk>=0.2.87",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tome_agent"]

[tool.ruff]
target-version = "py312"
